<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="40%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#0a0818" />
  
  <g transform="translate(116, 120)" fill="url(#logoGrad)" filter="url(#glow)">
    <!-- Equalizer bars shaped like a play button or abstract M -->
    <rect x="0" y="80" width="40" height="110" rx="20" />
    <rect x="60" y="30" width="40" height="160" rx="20" />
    <rect x="120" y="0" width="40" height="270" rx="20" />
    <rect x="180" y="50" width="40" height="140" rx="20" />
    <rect x="240" y="100" width="40" height="90" rx="20" />
  </g>
</svg>
