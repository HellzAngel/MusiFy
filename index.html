<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MusiFy — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent:    #a78bfa;
      --accent2:   #67e8f9;
      --accent3:   #f9a8d4;
      --font:      'Space Grotesk', sans-serif;
      --font-d:    'Syne', sans-serif;
    }

    body {
      font-family: var(--font);
      background: #06040f;
      color: #e8e8f0;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── background canvas ── */
    #loginCanvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ── vivid gradient orbs that make the glass visible ── */
    .orb-layer {
      position: fixed; inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.75;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #7c3aed, #4f46e5);
      top: -120px; right: 60px;
      animation: orbDrift1 12s ease-in-out infinite;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #0891b2, #06b6d4);
      bottom: -80px; right: 120px;
      animation: orbDrift2 14s ease-in-out infinite;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #db2777, #9333ea);
      top: 40%; right: 35%;
      animation: orbDrift3 10s ease-in-out infinite;
    }
    .orb-4 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, #059669, #0891b2);
      bottom: 10%; right: 5%;
      animation: orbDrift1 16s ease-in-out infinite reverse;
    }
    @keyframes orbDrift1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33%  { transform: translate(-30px,20px) scale(1.05); }
      66%  { transform: translate(20px,-25px) scale(0.95); }
    }
    @keyframes orbDrift2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%  { transform: translate(25px,-35px) scale(1.08); }
    }
    @keyframes orbDrift3 {
      0%,100% { transform: translate(0,0); }
      50%  { transform: translate(-20px,30px); }
    }

    /* ── full-page layout ── */
    .page-wrap {
      position: fixed; inset: 0;
      z-index: 2;
      display: flex;
      align-items: stretch;
    }

    /* ═══════════════════════════════════
       RIGHT PANEL  (login card)
    ═══════════════════════════════════ */
    .right-panel {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: transparent;
      position: relative;
    }
    /* orbs live inside right-panel so they paint behind the card */
    .right-panel .orb-inner {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .right-panel .orb-inner .orb { position: absolute; border-radius: 50%; filter: blur(70px); }
    .right-panel .orb-inner .ri-1 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(124,58,237,0.9), rgba(79,70,229,0.6));
      top: -140px; right: -60px;
      animation: orbDrift1 12s ease-in-out infinite;
    }
    .right-panel .orb-inner .ri-2 {
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(8,145,178,0.9), rgba(6,182,212,0.6));
      bottom: -100px; left: -40px;
      animation: orbDrift2 14s ease-in-out infinite;
    }
    .right-panel .orb-inner .ri-3 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(219,39,119,0.85), rgba(147,51,234,0.6));
      top: 45%; left: 25%;
      animation: orbDrift3 10s ease-in-out infinite;
    }

    /* ── glass card — capped width so it stays elegant on wide screens —— */
    .login-card {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      /* gradient-glass: works regardless of stacking-context */
      background:
        linear-gradient(135deg,
          rgba(124,58,237,0.28)  0%,
          rgba(79,70,229,0.18)  35%,
          rgba(8,145,178,0.18)  65%,
          rgba(219,39,119,0.15) 100%),
        rgba(10,8,28,0.55);
      border-radius: 28px;
      border-top:    1px solid rgba(255,255,255,0.40);
      border-left:   1px solid rgba(255,255,255,0.22);
      border-right:  1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 48px 44px;
      box-shadow:
        0 4px 24px rgba(124,58,237,0.25),
        0 24px 64px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.38),
        inset 1px 0 0 rgba(255,255,255,0.18);
      animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
      overflow: hidden;
    }

    /* rainbow top-edge glow */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(167,139,250,0.8) 25%,
        rgba(103,232,249,0.8) 50%,
        rgba(249,168,212,0.8) 75%,
        transparent);
      border-radius: 1px;
    }

    /* soft inner orb glow */
    .login-card::after {
      content: '';
      position: absolute;
      width: 360px; height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(124,58,237,0.10) 0%,
        rgba(103,232,249,0.06) 50%,
        transparent 70%);
      top: -120px; right: -100px;
      pointer-events: none;
      animation: orbFloat 9s ease-in-out infinite;
    }
    @keyframes orbFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(-16px,18px) scale(1.07); }
    }

    @keyframes slideUp {
      from { opacity:0; transform: translateY(28px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ── card header ── */
    .card-header { margin-bottom: 36px; position: relative; z-index: 1; }
    .card-eyebrow {
      font-size: 11px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-eyebrow::before {
      content: '';
      display: inline-block;
      width: 18px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
    }
    .card-title {
      font-family: var(--font-d);
      font-size: 32px; font-weight: 800;
      letter-spacing: -1px; color: #fff;
      line-height: 1.1; margin-bottom: 8px;
    }
    .card-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.38);
    }

    /* ── form ── */
    .login-form { display:flex; flex-direction:column; gap:16px; position: relative; z-index: 1; }

    .form-group { display:flex; flex-direction:column; gap:8px; }
    .form-label {
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .form-input-wrap { position: relative; }
    .form-input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: rgba(167,139,250,0.6); font-size: 14px; z-index: 1;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 14px 46px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px;
      color: #fff;
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .form-input::placeholder { color: rgba(255,255,255,0.38); }
    .form-input:focus {
      border-color: rgba(167,139,250,0.7);
      background: rgba(167,139,250,0.18);
      box-shadow:
        0 0 0 4px rgba(167,139,250,0.18),
        inset 0 1px 0 rgba(255,255,255,0.20);
    }
    .form-input:hover:not(:focus) {
      border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.16);
    }
    .form-input.error {
      border-color: rgba(239,68,68,0.7);
      box-shadow: 0 0 0 4px rgba(239,68,68,0.12);
    }

    .toggle-password {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,0.28); cursor: pointer;
      font-size: 14px; transition: color 0.2s; padding: 4px;
    }
    .toggle-password:hover { color: rgba(255,255,255,0.7); }

    /* ── divider ── */
    .form-divider {
      height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(255,255,255,0.1), transparent);
      margin: 2px 0;
    }

    /* ── error ── */
    .error-msg {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 14px;
      background: rgba(239,68,68,0.09);
      border: 1px solid rgba(239,68,68,0.22);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      color: #fca5a5; font-size: 13px;
      opacity: 0; transform: translateY(-6px);
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
    }
    .error-msg.visible { opacity:1; transform:translateY(0); pointer-events:auto; }

    /* ── submit button ── */
    .login-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 50%, #38bdf8 100%);
      background-size: 200% auto;
      border: none; border-radius: 14px;
      color: #fff;
      font-family: var(--font);
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: all 0.35s ease;
      position: relative; overflow: hidden;
      margin-top: 6px;
      letter-spacing: 0.4px;
      box-shadow:
        0 4px 24px rgba(124,58,237,0.40),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .login-btn:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow:
        0 12px 40px rgba(124,58,237,0.50),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .login-btn:active { transform: translateY(0); }
    .login-btn.loading { pointer-events:none; opacity:0.75; }
    .login-btn-text { transition: opacity 0.25s; }
    .login-btn.loading .login-btn-text { opacity:0; }
    .login-spinner {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      opacity:0; transition: opacity 0.25s;
    }
    .login-btn.loading .login-spinner { opacity:1; }
    .login-spinner i { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* shimmer sweep on button */
    .login-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(105deg,
        transparent 30%, rgba(255,255,255,0.20) 50%, transparent 70%);
      background-size: 200% 100%;
      background-position: 200% 0;
      transition: background-position 0.5s ease;
    }
    .login-btn:hover::after { background-position: -20% 0; }

    /* ── hint strip ── */
    .hint-strip {
      margin-top: 22px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: rgba(255,255,255,0.22);
      position: relative; z-index: 1;
    }
    .hint-strip i { color: rgba(167,139,250,0.5); }

    /* ═══════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════ */
    @media (max-width: 860px) {
      .right-panel { padding: 28px 20px; }
      .right-panel .orb-inner .ri-1 { width: 340px; height: 340px; top: -80px; right: -80px; }
      .right-panel .orb-inner .ri-2 { width: 280px; height: 280px; bottom: -60px; left: -60px; }
      .right-panel .orb-inner .ri-3 { top: 55%; left: 30%; }
      .login-card { padding: 40px 28px; }
    }
    @media (max-width: 480px) {
      .right-panel { padding: 28px 20px; }
      .card-title { font-size: 26px; }
    }

    /* ════════════════════════════════
       LOADING SCREEN
    ════════════════════════════════ */
    #loadScreen {
      position: fixed; inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06040f;
      overflow: hidden;
      /* fade out at 3.5s, gone by 4s */
      animation: lsFadeOut 0.55s ease 3.45s forwards;
    }
    @keyframes lsFadeOut {
      to { opacity: 0; pointer-events: none; }
    }

    /* background orbs */
    .ls-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }
    .ls-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(124,58,237,0.7), rgba(79,70,229,0.4));
      top: -150px; right: -80px;
      animation: orbDrift1 10s ease-in-out infinite;
    }
    .ls-orb-2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(8,145,178,0.7), rgba(6,182,212,0.4));
      bottom: -120px; left: -60px;
      animation: orbDrift2 12s ease-in-out infinite;
    }
    .ls-orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(219,39,119,0.6), rgba(147,51,234,0.4));
      top: 45%; left: 20%;
      animation: orbDrift3 9s ease-in-out infinite;
    }

    .ls-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      position: relative;
      z-index: 1;
      animation: lsEnter 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes lsEnter {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* logo */
    .ls-logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .ls-logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #fff;
      box-shadow:
        0 0 40px rgba(124,58,237,0.6),
        0 8px 32px rgba(0,0,0,0.5);
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { box-shadow: 0 0 40px rgba(124,58,237,0.6), 0 8px 32px rgba(0,0,0,0.5); }
      50%      { box-shadow: 0 0 70px rgba(124,58,237,0.9), 0 8px 32px rgba(0,0,0,0.5); }
    }
    .ls-logo-text {
      font-family: var(--font-d);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(90deg, #a78bfa, #67e8f9, #f9a8d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% auto;
      animation: gradShiftLS 3s linear infinite;
    }
    @keyframes gradShiftLS {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* EQ bars */
    .ls-bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 40px;
    }
    .ls-bars span {
      display: block;
      width: 5px;
      border-radius: 3px;
      background: linear-gradient(to top, #7c3aed, #67e8f9);
      animation: lsBar 1.1s ease-in-out infinite;
      animation-delay: var(--d);
    }
    @keyframes lsBar {
      0%,100% { height: 8px;  opacity: 0.5; }
      50%      { height: 36px; opacity: 1; }
    }

    /* tagline */
    .ls-tagline {
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* progress bar */
    .ls-progress-track {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .ls-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: linear-gradient(90deg, #7c3aed, #67e8f9, #f9a8d4);
      animation: lsProgress 3.4s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes lsProgress {
      0%   { width: 0%; }
      80%  { width: 90%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ════════ LOADING SCREEN ════════ -->
  <div id="loadScreen">
    <!-- background orbs (same palette as login) -->
    <div class="ls-orb ls-orb-1"></div>
    <div class="ls-orb ls-orb-2"></div>
    <div class="ls-orb ls-orb-3"></div>

    <div class="ls-inner">
      <!-- logo mark -->
      <div class="ls-logo">
        <div class="ls-logo-icon">
          <i class="fas fa-headphones"></i>
        </div>
        <span class="ls-logo-text">MusiFy</span>
      </div>

      <!-- animated EQ bars -->
      <div class="ls-bars">
        <span style="--d:0.0s"></span>
        <span style="--d:0.1s"></span>
        <span style="--d:0.2s"></span>
        <span style="--d:0.3s"></span>
        <span style="--d:0.15s"></span>
        <span style="--d:0.25s"></span>
        <span style="--d:0.05s"></span>
        <span style="--d:0.35s"></span>
        <span style="--d:0.18s"></span>
        <span style="--d:0.28s"></span>
      </div>

      <div class="ls-tagline">Your music, every language.</div>

      <!-- progress bar -->
      <div class="ls-progress-track">
        <div class="ls-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Three.js canvas -->
  <canvas id="loginCanvas"></canvas>

  <!-- Vivid gradient orbs — give the glass something colorful to blur -->
  <div class="orb-layer">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- Full-page centered layout -->
  <div class="page-wrap">

    <!-- login card (centered full-page) -->
    <div class="right-panel">
      <!-- orbs behind the glass card -->
      <div class="orb-inner">
        <div class="orb ri-1"></div>
        <div class="orb ri-2"></div>
        <div class="orb ri-3"></div>
      </div>
      <div class="login-card">

        <div class="card-header">
          <div class="card-eyebrow">Welcome back</div>
          <div class="card-title">Sign in to<br/>MusiFy</div>
          <div class="card-sub">Enter your credentials to continue</div>
        </div>

        <form class="login-form" id="loginForm" autocomplete="off">

          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="form-input-wrap">
              <i class="fas fa-user form-input-icon"></i>
              <input type="text" id="username" class="form-input"
                placeholder="Enter your username"
                autocomplete="off" spellcheck="false" />
            </div>
          </div>

          <div class="form-divider"></div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-wrap">
              <i class="fas fa-lock form-input-icon"></i>
              <input type="password" id="password" class="form-input"
                placeholder="Enter your password"
                autocomplete="off"
                data-form-type="other" />
              <button type="button" class="toggle-password" id="togglePass">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="error-msg" id="errorMsg">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">Invalid username or password</span>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <span class="login-btn-text">
              <i class="fas fa-arrow-right-to-bracket" style="margin-right:8px;"></i>Sign In
            </span>
            <div class="login-spinner"><i class="fas fa-circle-notch"></i></div>
          </button>

        </form>

        <div class="hint-strip">
          <i class="fas fa-shield-halved"></i>
          Passwords secured with SHA-256 encryption
        </div>

      </div>
    </div><!-- /right-panel -->

  </div><!-- /page-wrap -->

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>


  <script>
  // =============================================
  //  THREE.JS INTERACTIVE LOGIN BACKGROUND
  // =============================================

  (function() {
    const canvas = document.getElementById('loginCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x04040a, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 3;

    // ---- Starfield ----
    const starCount = 2500;
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3]     = (Math.random() - 0.5) * 20;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
      // Color variation: purple to cyan
      const t = Math.random();
      starColors[i * 3]     = 0.3 + t * 0.5;  // R
      starColors[i * 3 + 1] = 0.1 + t * 0.7;  // G
      starColors[i * 3 + 2] = 0.5 + t * 0.5;  // B
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const starMat = new THREE.PointsMaterial({
      size: 0.025,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      sizeAttenuation: true
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ---- Particle Sphere ----
    const PARTICLE_COUNT = 1800;
    const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
    const basePositions = new Float32Array(PARTICLE_COUNT * 3);
    const particleColors = new Float32Array(PARTICLE_COUNT * 3);
    const randomOffsets = new Float32Array(PARTICLE_COUNT);
    const RADIUS = 1.5;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      // Golden ratio sphere distribution
      const phi = Math.acos(1 - 2 * (i + 0.5) / PARTICLE_COUNT);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const x = RADIUS * Math.sin(phi) * Math.cos(theta);
      const y = RADIUS * Math.sin(phi) * Math.sin(theta);
      const z = RADIUS * Math.cos(phi);

      particlePositions[i * 3]     = x;
      particlePositions[i * 3 + 1] = y;
      particlePositions[i * 3 + 2] = z;
      basePositions[i * 3]     = x;
      basePositions[i * 3 + 1] = y;
      basePositions[i * 3 + 2] = z;
      randomOffsets[i] = Math.random() * Math.PI * 2;

      // Purple to cyan gradient based on Y position
      const t = (y + RADIUS) / (2 * RADIUS);
      particleColors[i * 3]     = 0.35 + t * 0.2;   // R
      particleColors[i * 3 + 1] = 0.1 + t * 0.72;   // G
      particleColors[i * 3 + 2] = 0.6 + t * 0.35;   // B
    }

    const sphereGeo = new THREE.BufferGeometry();
    sphereGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    sphereGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
    const sphereMat = new THREE.PointsMaterial({
      size: 0.018,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      sizeAttenuation: true
    });
    const sphere = new THREE.Points(sphereGeo, sphereMat);
    scene.add(sphere);

    // ---- Inner glow sphere ----
    const glowGeo = new THREE.SphereGeometry(1.45, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x8b5cf6,
      transparent: true,
      opacity: 0.03,
      wireframe: false
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glowMesh);

    // ---- Mouse tracking ----
    const mouse = { x: 0, y: 0 };
    const targetRotation = { x: 0, y: 0 };
    const currentRotation = { x: 0, y: 0 };

    document.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.y = -(e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Touch support
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
        mouse.y = -(e.touches[0].clientY / window.innerHeight - 0.5) * 2;
      }
    }, { passive: true });

    // ---- Resize ----
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---- Animation ----
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Smooth rotation toward mouse
      targetRotation.x = mouse.y * 0.5;
      targetRotation.y = mouse.x * 0.8;
      currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
      currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;

      sphere.rotation.x = currentRotation.x;
      sphere.rotation.y = currentRotation.y + elapsed * 0.12;

      glowMesh.rotation.y = elapsed * 0.1;
      stars.rotation.y = elapsed * 0.01;
      stars.rotation.x = elapsed * 0.005;

      // Pulse particle sphere positions
      const positions = sphereGeo.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const offset = randomOffsets[i];
        const wave = Math.sin(elapsed * 0.8 + offset) * 0.04;
        const bx = basePositions[i * 3];
        const by = basePositions[i * 3 + 1];
        const bz = basePositions[i * 3 + 2];
        const len = Math.sqrt(bx * bx + by * by + bz * bz);
        positions[i * 3]     = bx + (bx / len) * wave;
        positions[i * 3 + 1] = by + (by / len) * wave;
        positions[i * 3 + 2] = bz + (bz / len) * wave;
      }
      sphereGeo.attributes.position.needsUpdate = true;

      // ---- Auto color cycle — shift hue across all particles ----
      const cols = sphereGeo.attributes.color.array;
      // 5 palette hues that blend smoothly: violet, cyan, pink, green, blue
      const HUES = [0.76, 0.54, 0.92, 0.38, 0.62];
      const cycleDur = 6; // seconds per palette step
      const palPos  = (elapsed / cycleDur) % HUES.length;
      const palIdx  = Math.floor(palPos) % HUES.length;
      const palNext = (palIdx + 1) % HUES.length;
      const palBlend = palPos - Math.floor(palPos);
      let dh = HUES[palNext] - HUES[palIdx];
      if (dh >  0.5) dh -= 1;
      if (dh < -0.5) dh += 1;
      const baseHue = ((HUES[palIdx] + dh * palBlend) + 1) % 1;

      const tmpColor = new THREE.Color();
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        // each particle gets a slight hue offset so the orb shimmers
        const hue = (baseHue + i * 0.0003 + Math.sin(elapsed * 0.4 + i * 0.07) * 0.04 + 1) % 1;
        const sat = 0.75 + Math.sin(elapsed * 0.6 + i * 0.05) * 0.10;
        const lit = 0.55 + Math.sin(elapsed * 0.9 + i * 0.11) * 0.12;
        tmpColor.setHSL(hue, sat, lit);
        cols[i * 3]     = tmpColor.r;
        cols[i * 3 + 1] = tmpColor.g;
        cols[i * 3 + 2] = tmpColor.b;
      }
      sphereGeo.attributes.color.needsUpdate = true;

      // Also shift glow to match
      glowMat.color.setHSL(baseHue, 0.80, 0.60);

      // Pulse glow
      glowMat.opacity = 0.02 + Math.sin(elapsed * 1.5) * 0.015;

      renderer.render(scene, camera);
    }
    animate();
  })();

  // =============================================
  //  LOGIN LOGIC
  // =============================================

  // Passwords stored as SHA-256 hashes only — plaintext never in source
  const USERS = {
    surya:   { ph: '34a12809061e749271ae972328cd38bdd7fe3fc83bcfd5fc922e01dd1c3ba376', name: 'Surya',   avatar: 'S', color: '#8b5cf6' },
    ananthu: { ph: '77cce19facdc944ca9e5418413862881a33c731ed33f67ff254699f1b9570c77', name: 'Ananthu', avatar: 'A', color: '#22d3ee' },
    devika:  { ph: 'c99bc6f668e8999a380975a9be485150f91070498f11f5bf0d56f67eb0f68930', name: 'Devika',  avatar: 'D', color: '#f472b6' },
    sonu:    { ph: '65799f51379727f9a584975c238568cd1c570ef0873c10f3d5a546fcbe6073f3', name: 'Sonu',    avatar: 'S', color: '#34d399' },
    bromin:  { ph: '080b9643325aeb8de8c556420ab27403c28a13ef5a8d40d8fec0bf9adada73a8', name: 'Bromin',  avatar: 'B', color: '#f97316' },
    arjun:   { ph: '26a95b1e69c92f1cfb0381fd379d80526ecd9c368d3a7baa9be6c24b61a25e71', name: 'Arjun',   avatar: 'A', color: '#ef4444' },
    deva:    { ph: '55ac2b3161e9c9e2ecb04869ae5e4d6b372f6f1733fede2a06738af09a761c59', name: 'Deva',    avatar: 'D', color: '#a855f7' },
    amal:    { ph: '24bb9a41fcc4b3db6a3450ed9171b8c23ee9b494659f6ebfb697b30ea83d1fac', name: 'Amal',    avatar: 'A', color: '#10b981' },
    sounder: { ph: 'c8d22056fcdcff4bc5dd5bee816553dc939adc6ac0d68d9fff05c9d8c9cf9338', name: 'Sounder', avatar: 'S', color: '#fb923c' },
    zlatan:  { ph: 'a07c9be3cf72583e2829199730b483412c4280ce3fb210bc99237671447780d4', name: 'Zlatan',  avatar: 'Z', color: '#38bdf8' },
    athu:    { ph: 'ae20f98677a4659ee2e6a1e7a85176cc17ae4574d0ba6c81072ea2e4a161b5cb', name: 'Athu',    avatar: 'A', color: '#4ade80' }
  };

  // Remove loading screen from DOM after 4 s (CSS fades it at 3.5 s)
  setTimeout(() => {
    const ls = document.getElementById('loadScreen');
    if (ls) ls.remove();
  }, 4000);

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  const form = document.getElementById('loginForm');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const errorMsg = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  const loginBtn = document.getElementById('loginBtn');
  const togglePass = document.getElementById('togglePass');

  // Toggle password visibility
  togglePass.addEventListener('click', () => {
    const isPass = passwordInput.type === 'password';
    passwordInput.type = isPass ? 'text' : 'password';
    togglePass.querySelector('i').className = isPass ? 'fas fa-eye-slash' : 'fas fa-eye';
  });

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.classList.add('visible');
    usernameInput.classList.add('error');
    passwordInput.classList.add('error');
    loginBtn.style.animation = 'shake 0.4s ease';
    setTimeout(() => loginBtn.style.animation = '', 400);
  }

  function hideError() {
    errorMsg.classList.remove('visible');
    usernameInput.classList.remove('error');
    passwordInput.classList.remove('error');
  }

  usernameInput.addEventListener('input', hideError);
  passwordInput.addEventListener('input', hideError);

  // Shake animation
  const style = document.createElement('style');
  style.textContent = `
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)}
      60%{transform:translateX(-5px)}
      80%{transform:translateX(5px)}
    }`;
  document.head.appendChild(style);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = usernameInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!username) { showError('Please enter your username'); return; }
    if (!password) { showError('Please enter your password'); return; }

    loginBtn.classList.add('loading');

    const user = USERS[username];
    if (!user) {
      loginBtn.classList.remove('loading');
      showError('User not found.');
      return;
    }

    const inputHash = await sha256(password);
    if (inputHash !== user.ph) {
      loginBtn.classList.remove('loading');
      showError('Incorrect password. Please try again.');
      return;
    }

    // Success — store session & redirect
    const existing = JSON.parse(localStorage.getItem('musify_users') || '{}');
    if (!existing[username]) existing[username] = { favorites: [] };
    localStorage.setItem('musify_users', JSON.stringify(existing));
    sessionStorage.setItem('musify_session', JSON.stringify({
      username,
      name: user.name,
      avatar: user.avatar,
      color: user.color,
      loginTime: Date.now()
    }));

    // Animate out and redirect
    document.querySelector('.right-panel').style.transition = 'all 0.5s ease';
    document.querySelector('.right-panel').style.transform = 'translateX(40px)';
    document.querySelector('.right-panel').style.opacity = '0';
    document.querySelector('.left-panel') && (document.querySelector('.left-panel').style.transition = 'opacity 0.5s ease');
    document.querySelector('.left-panel') && (document.querySelector('.left-panel').style.opacity = '0');

    setTimeout(() => {
      window.location.replace('player.html');
    }, 600);
  });
  </script>
